services:
  # ---------------------------------------------------------
  # 1. Backend Web Service (Node.js + Express + Socket.io)
  # ---------------------------------------------------------
  - type: web
    name: cargoshare-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false # Set to your deployed frontend URL (e.g. https://cargoshare-frontend.onrender.com)
      - key: MONGO_URI
        sync: false # Set your MongoDB Atlas connection URI in Render Dashboard
      - key: DATABASE_URL
        sync: false # Optional: PostgreSQL connection URI (e.g. Render Postgres)

  # ---------------------------------------------------------
  # 2. Frontend Static Site (Vite + React SPA)
  # ---------------------------------------------------------
  - type: static
    name: cargoshare-frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # Set to your backend URL (e.g. https://cargoshare-backend.onrender.com)
