databases:
  # ---------------------------------------------------------
  # PostgreSQL Database (Free Managed Database on Render)
  # ---------------------------------------------------------
  - name: cargoshare-db
    databaseName: cargoshare
    user: cargoshare_user
    plan: free

services:
  # ---------------------------------------------------------
  # 1. Backend Web Service (Node.js + Express + PostgreSQL)
  # ---------------------------------------------------------
  - type: web
    name: cargoshare-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false # Set to your frontend URL (e.g. https://cargoshare-frontend.onrender.com)
      - key: DATABASE_URL
        fromDatabase:
          name: cargoshare-db
          property: connectionString

  # ---------------------------------------------------------
  # 2. Frontend Static Site (Vite + React SPA)
  # ---------------------------------------------------------
  - type: web
    name: cargoshare-frontend
    runtime: static
    buildCommand: npm install && npm run build
    publishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
      - type: rewrite
        source: /assets/*
        destination: /assets/*
    envVars:
      - key: VITE_API_URL
        sync: false # Set to your backend URL (e.g. https://cargoshare-backend.onrender.com)
